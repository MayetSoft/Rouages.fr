    partagee_avec: [region]
    banatic: ["4000", "4005"]
    # La loi NOTRe la transfère de plein droit depuis le 1er janvier 2017. Les
    # EPT en sont exclus : dans le Grand Paris, c'est la métropole qui l'exerce,
    # ce que confirme le registre — aucun des onze EPT ne la déclare.
    obligatoire_pour: [CC, CA, CU, METRO, MET69]
    liens: [cgct, cgct-l5214-16, cgct-l5216-5, vp-competences, wp-loi-notre]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: logement-social
    nom: "Logement social"
    acteur: epci
    resume: "Programmation et attribution partagées entre l'intercommunalité, la commune, l'État et les bailleurs."
    partagee_avec: [commune, etat, bailleur-social, anah]
    banatic: ["6500", "6505"]
    # « Équilibre social de l'habitat » est obligatoire pour les communautés
    # d'agglomération (L5216-5), urbaines (L5215-20) et les métropoles
    # (L5217-2), et la loi y range explicitement le programme local de
    # l'habitat et les aides au logement social — les deux codes ci-dessus.
    # Les communautés de communes en sont exclues : chez elles la politique du
    # logement reste facultative (L5214-16).
    obligatoire_pour: [CA, CU, METRO, MET69]
    reserve: "Dans une communauté d'agglomération, les aides au logement social ne portent que sur ce que le conseil communautaire a défini comme d'intérêt communautaire ; une communauté urbaine ou une métropole, elle, est compétente sur tout le champ sans avoir à le délimiter."
