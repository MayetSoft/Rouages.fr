  # 5 % de couverture seulement, et c'est correct — l'inverse du cas de la
  # concession électrique. Là-bas, un registre à 15 % dans un département contre
  # 94 % en France signale un registre incomplet. Ici, 5 % est le chiffre réel :
  # l'article L2223-1 oblige chaque commune à disposer d'un cimetière, donc
  # presque aucune ne le transfère. Le silence du registre veut bien dire « la
  # commune », et l'heuristique de couverture, qui compare le département à la
  # moyenne nationale et non à 100 %, ne s'y trompe pas.
  - id: cimetiere
    nom: "Cimetière et sites cinéraires"
    nom_court: "Cimetière"
    acteur: commune
    resume: "Chaque commune doit disposer d'un cimetière, et à partir de 2 000 habitants d'un site cinéraire. Le conseil municipal en fixe le règlement et le prix des concessions."
    partagee_avec: [maire, epci]
    banatic: ["2500"]
    # La Métropole du Grand Paris déclare bien ce code à BANATIC, et le site la
    # nomme donc pour Paris. En conclure qu'elle gère le Père-Lachaise serait
    # faux : déclarer la compétence n'est pas gérer chaque cimetière. C'est le
    # cas où la réserve compte le plus, parce que la réponse est exacte et
    # l'inférence naturelle qu'on en tire ne l'est pas.
    reserve: "Chaque commune doit disposer de son cimetière : une intercommunalité qui déclare cette compétence ne gère pas forcément le vôtre. Le crématorium est encore autre chose, souvent porté par un syndicat distinct."
    liens: [wp-cimetiere, sp-concession-funeraire, cgct-l2223-1]
    verifie_le: 2026-09-12
    confiance: etabli

  - id: reseaux-numeriques
    nom: "Réseaux de communications électroniques"
    nom_court: "Numérique et fibre"
    acteur: commune
    resume: "Là où aucun opérateur privé ne déploie, une collectivité peut construire le réseau elle-même puis le confier à un exploitant : c'est ainsi qu'une grande partie de la fibre rurale existe."
    partagee_avec: [epci, departement, region, etat]
