  # Quatre compétences que le site décrivait par leur absence. Les deux
  # premières sont un cas à part : l'article L1111-4 du CGCT les déclare
  # *partagées* entre commune, département, région et État. Le reste du site
  # répond « qui exerce » ; ici la réponse honnête est « plusieurs à la fois »,
  # et la réserve le dit plutôt que de laisser croire à un exerçant unique.
  - id: action-culturelle
    nom: "Culture et lecture publique"
    nom_court: "Culture"
    acteur: commune
    resume: "Bibliothèque, école de musique, salle de spectacle : rien de tout cela n'est obligatoire, et c'est pourtant le service culturel le plus proche de chez soi."
    partagee_avec: [epci, departement, region, etat]
    banatic: ["5035"]
    reserve: "La culture est une compétence partagée : commune, département, région et État peuvent intervenir sur le même équipement. La réponse ci-dessus dit qui l'exerce localement, pas qui le finance."
    liens: [wp-bibliotheque-municipale, culture-gouv, cgct-l1111-4, code-patrimoine]
