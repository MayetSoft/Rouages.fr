    nom: "État civil"
    acteur: commune
    resume: "Naissances, mariages, décès, cartes d'identité et passeports : la commune agit ici au nom de l'État."
    partagee_avec: [etat]
    liens: [cgct, cl-gouv]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: ecoles-primaires
    nom: "Écoles maternelles et élémentaires"
    nom_court: "Écoles primaires"
    acteur: commune
    resume: "La commune possède et entretient les bâtiments et paie les agents ; l'État recrute et paie les enseignants."
    partagee_avec: [rectorat]
    banatic: ["5010"]
    liens: [code-education, vp-competences, od-annuaire-education]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: carte-scolaire
    nom: "Ouverture et fermeture de classes"
    nom_court: "Ouverture de classes"
    acteur: rectorat
    resume: "Décidée par les services de l'État, pas par le maire — même quand la commune est propriétaire de l'école."
    partagee_avec: [commune]
    liens: [code-education, education-gouv]
    verifie_le: 2026-09-05
    confiance: a_confirmer

  - id: police-tranquillite
    nom: "Tranquillité et salubrité publiques"
    nom_court: "Tranquillité publique"
    acteur: maire
    resume: "Pouvoir de police du maire : bruit, animaux, occupation du domaine public, arrêtés municipaux."
    partagee_avec: [prefet]
    liens: [cgct, code-securite-interieure]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: voirie-communale
    nom: "Voirie communale"
    acteur: commune
    resume: "Rues et chemins communaux. Les routes départementales et nationales relèvent d'autres gestionnaires, même en traversée de bourg."
    partagee_avec: [departement]
    banatic: ["6040"]
    liens: [cgct, cl-gouv]
    verifie_le: 2026-09-05
    confiance: etabli

  # Pas d'`obligatoire_pour` : le transfert du PLU aux communautés de communes
  # et d'agglomération est bien prévu par défaut, mais une minorité de blocage
  # de communes peut s'y opposer, et beaucoup l'ont fait. Une règle
  # conditionnelle ne se réduit pas à « la loi tranche ».
  - id: redaction-plu
    nom: "Écrire la règle d'urbanisme (PLU)"
    nom_court: "Règle d'urbanisme (PLU)"
    acteur: commune
    resume: "Le document qui dit ce qui est constructible. De plus en plus souvent transféré à l'intercommunalité sous forme de PLUi."
    partagee_avec: [epci]
    banatic: ["5510"]
    liens: [wp-plu, code-urbanisme, od-gpu, od-banatic]
    verifie_le: 2026-09-05
    confiance: variable_selon_territoire

  - id: instruction-autorisations
    nom: "Instruire les demandes d'autorisation d'urbanisme"
    nom_court: "Instruction des permis"
    acteur: service-instructeur
    resume: >
      Le travail technique qui précède la signature. Le plus souvent mutualisé
      par convention, ce que le registre des compétences ne recense pas.
    partagee_avec: [commune, epci, etat]
    liens: [cu-r423-19, od-banatic, sp-permis]
    verifie_le: 2026-09-06
    confiance: variable_selon_territoire

  - id: delivrance-autorisation-urbanisme
    nom: "Délivrer les permis de construire"
    nom_court: "Permis de construire"
    acteur: maire
    resume: "Le maire signe, au nom de la commune si elle a un document d'urbanisme, au nom de l'État sinon."
    partagee_avec: [abf, prefet]
    banatic: ["5530"]
    # Seuls 2 à 4 % des intercommunalités déclarent ce transfert, parce que le
    # mécanisme réel n'en est pas un : l'instruction se mutualise par
    # convention de service commun, et une convention n'entre pas au registre.
    reserve: "Le maire signe, mais l'instruction du dossier est souvent confiée au service d'urbanisme de l'intercommunalité. Cette mutualisation se fait par convention, pas par transfert de compétence : elle n'apparaît donc dans aucun registre national."
    liens: [cu-l422-1, code-patrimoine, sp-permis]
    verifie_le: 2026-09-06
    confiance: etabli

  # --- Intercommunalité -------------------------------------------------
  - id: dechets-menagers
    nom: "Collecte et traitement des déchets"
    nom_court: "Déchets ménagers"
    acteur: epci
    resume: "Compétence intercommunale dans la quasi-totalité des territoires, financée par la taxe ou la redevance d'enlèvement."
    partagee_avec: [commune]
    banatic: ["2080", "2085"]
    # Obligatoire pour les communautés de communes et d'agglomération depuis le
    # 1er janvier 2017 (loi NOTRe), et par construction pour les communautés
    # urbaines et les métropoles. Le registre le reflète déjà — 100 % de
    # couverture — mais l'inscrire protège d'un trou de saisie à venir.
    obligatoire_pour: [CC, CA, CU, METRO, MET69]
    liens: [cgct, cgct-l5214-16, cgct-l5216-5, od-sinoe, od-banatic, wp-loi-notre]
    verifie_le: 2026-09-11
    confiance: etabli

  # Pas d'`obligatoire_pour` : le transfert aux communautés de communes a été
  # reporté plusieurs fois, et la date applicable dépend du calendrier en
  # vigueur. Le registre couvre déjà 92 % des communes pour l'eau et 97 % pour
  # l'assainissement : le gain serait mince, et le risque de se tromper avec
  # l'autorité de la loi ne vaut pas la peine tant que l'article n'est pas
  # vérifié.
  - id: eau-potable
    nom: "Eau potable"
    acteur: epci
    resume: "Captage, traitement, distribution. Exercée en régie ou déléguée à une entreprise ; le prix au mètre cube varie fortement d'un territoire à l'autre."
    partagee_avec: [commune, syndicat-eau, delegataire-eau]
    banatic: ["1505"]
    sispea: "D102.0"
    liens: [cgct, od-sispea, eaufrance, od-banatic]
    verifie_le: 2026-09-05
    confiance: variable_selon_territoire

  - id: assainissement
    nom: "Assainissement"
    acteur: epci
    resume: "Collecte et traitement des eaux usées, facturés sur la facture d'eau."
