  # --- Les branches du pouvoir --------------------------------------------
  # Ces compétences existent d'abord pour que les entités de l'État ne soient
  # pas des nœuds isolés : un nœud qu'on ne peut relier à rien n'apprend rien.
  # Chacune est une attribution réelle, et le partage y est l'information
  # principale — c'est lui qui explique pourquoi une décision met du temps.
  - id: vote-loi
    nom: "Vote de la loi"
    acteur: assemblee-nationale
    resume: "Les deux chambres examinent le même texte jusqu'à l'accord ; en cas de désaccord persistant, le Gouvernement peut donner le dernier mot à l'Assemblée."
    partagee_avec: [senat, gouvernement, president-republique]
