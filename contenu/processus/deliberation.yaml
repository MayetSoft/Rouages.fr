# Contester une délibération du conseil municipal.
# Le pendant « contrôle » du processus précédent : ce qu'on fait du document
# une fois qu'on l'a obtenu.
documents:
  - id: deliberation
    nom: "La délibération"
    resume: "L'acte par lequel le conseil décide. Public, affiché, transmis au préfet."
    ou_le_trouver: "Affichage en mairie, site de la commune, ou sur demande."
    liens: [cgct, cada]
  - id: proces-verbal
    nom: "Le procès-verbal de séance"
    resume: "Le compte rendu des débats, plus complet que la délibération elle-même."
    ou_le_trouver: "Mairie, sur demande."
    liens: [cgct, sp-documents-administratifs]

processus:
  - id: contester-deliberation
    nom: "Contester une délibération"
    famille: quotidien
    resume: "Une décision du conseil municipal ou communautaire vous paraît illégale : qui la contrôle, dans quel délai, et comment s'y prendre."
    declencheur: "Adoption d'une délibération par le conseil"
    sortie: "Délibération maintenue, retirée, ou annulée par le juge"
    decideur: tribunal-administratif
    competences: [vote-du-budget, controle-legalite, acces-documents]
    liens: [cgct, wp-recours-administratif, code-justice-administrative, cgct-l2131-6, collectivites-proces-verbal]
    verifie_le: 2026-09-22
    perime_apres_mois: 12
    # Les cinq étapes et les quatre leviers sont vérifiés. La correction qui a
    # compté est une mise à jour : la réforme du 1er juillet 2022 a supprimé
    # l'affichage du compte rendu sous huit jours et lui a substitué la
    # publication du procès-verbal — la fiche décrivait l'ancien régime.
    confiance: etabli

    etapes:
      - ordre: 1
        acteur: conseil-municipal
        action: "Séance publique et vote de la délibération"
        produit: [deliberation, proces-verbal]
        note: "Les séances sont publiques : on peut y assister sans y être invité."
        liens: [cgct]
        confiance: etabli
      - ordre: 2
        # Mise à jour : l'ordonnance du 7 octobre 2021, en vigueur depuis le 1er
        # juillet 2022, a supprimé l'affichage du compte rendu sous huit jours et lui
        # a substitué la publication du procès-verbal. La fiche décrivait l'ancien
        # régime.
        acteur: maire
        action: "Publication ou affichage, et transmission au préfet"
        note: "C'est la publicité de l'acte qui le rend exécutoire et qui fait courir les délais de recours. Depuis la réforme entrée en vigueur le 1er juillet 2022, c'est la publication électronique qui fait foi là où la commune a un site."
        liens: [cgct, collectivites-proces-verbal]
        confiance: etabli
      - ordre: 3
        acteur: prefet
        action: "Contrôle de légalité"
        delai: { valeur: 2, unite: mois, nature: maximum_legal }
        note: "Le préfet peut demander le retrait de l'acte, puis le déférer au tribunal administratif."
        liens: [cgct, wp-prefet, cgct-l2131-6]
        confiance: etabli
      - ordre: 4
        acteur: citoyen
        action: "Recours gracieux auprès de l'auteur de l'acte"
        conditionnelle: true
        delai: { valeur: 2, unite: mois, nature: maximum_legal }
        liens: [wp-recours-administratif, cgct-l2131-6]
        confiance: etabli
      - ordre: 5
        acteur: tribunal-administratif
        action: "Jugement du recours"
        liens: [code-justice-administrative]
        confiance: etabli

    leviers:
      - id: assister-a-la-seance
        quoi: "Assister à la séance du conseil"
        quand: "Avant le vote — l'ordre du jour est affiché à l'avance"
        aupres_de: "Personne : la séance est publique de droit"
        difficulte: faible
        ancre_etape: 1
        piege: "Assister ne donne pas la parole. Pour peser, il faut avoir écrit aux élus avant la séance."
        liens: [cgct]
        confiance: etabli
      - id: demander-le-pv
        # Le piège ajouté est celui qui coûte le plus cher : le procès-verbal n'est
        # publié qu'une fois approuvé, soit à la séance suivante, quand le délai de
        # recours contre la délibération court déjà depuis sa publication à elle.
        quoi: "Lire le procès-verbal, plus complet que la délibération"
        quand: "Dans la semaine qui suit la séance où il a été approuvé — soit un conseil plus tard"
        aupres_de: "Le site de la commune, ou la mairie à défaut"
        difficulte: faible
        recours_si_refus: "Saisir la CADA"
        ancre_etape: 2
        piege: "La délibération dit ce qui a été décidé, pas ce qui a été dit : les motifs utiles sont dans le procès-verbal. Mais il n'est publié qu'une fois approuvé, à la séance suivante — le délai de recours contre la délibération, lui, court déjà."
        liens: [cada, sp-documents-administratifs, collectivites-proces-verbal]
        confiance: etabli
      - id: alerter-le-prefet
        quoi: "Signaler l'illégalité supposée au préfet, au titre du contrôle de légalité"
        quand: "Pendant les deux mois qui suivent la transmission"
        aupres_de: "La préfecture"
        difficulte: moyenne
        ancre_etape: 3
        piege: "Le préfet n'est jamais obligé de déférer. Ce signalement ne conserve pas votre propre délai de recours : il faut mener les deux en parallèle."
        liens: [cgct, wp-prefet, cgct-l2131-6]
        confiance: etabli
      - id: reclamation-fiscale
        # Le levier que la relecture des flux avait repéré sans l'écrire. Une
        # délibération qui fixe un taux d'imposition se conteste deux fois : par
        # le recours pour excès de pouvoir, deux mois, et par la réclamation
        # contre son propre avis d'imposition, bien plus longue. La seconde voie
        # est la seule qui rende de l'argent.
        quoi: "Réclamer contre son propre avis d'imposition, quand la délibération fixe un taux"
        quand: "Jusqu'au 31 décembre de l'année qui suit la mise en recouvrement du rôle — bien après les deux mois du recours"
        aupres_de: "Le service des impôts dont relève l'avis, par réclamation préalable"
        difficulte: moyenne
        recours_si_refus: "Le tribunal administratif, une fois la réclamation rejetée"
        ancre_etape: 4
        piege: "L'annulation obtenue par un autre contribuable ne rouvre pas votre délai : le juge qui censure la délibération ne crée pas un « événement » au sens fiscal. Qui n'a pas réclamé dans son propre délai ne rattrape rien."
        liens: [lpf-r196-2, bofip-delai-reclamation, collectivites-teom, ce-448159]
        confiance: etabli
      - id: recours-deliberation
        quoi: "Former un recours devant le tribunal administratif"
        quand: "2 mois à compter de la publication ou de l'affichage"
        aupres_de: "Le tribunal administratif du ressort"
        difficulte: elevee
        ancre_etape: 4
        piege: "Il faut un intérêt à agir. Être contribuable de la commune en donne un dans certains cas, pas dans tous."
        liens: [code-justice-administrative, wp-recours-administratif, cgct-l2131-6]
        confiance: etabli
