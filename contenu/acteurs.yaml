    nom: "L'administration centrale"
    nom_court: "Admin. centrale"
    type: service_administratif
    echelon: etat
    pouvoirs: [executif]
    resume: "Les directions des ministères : elles préparent les textes, répartissent les crédits et pilotent les services déconcentrés qui appliquent la règle sur le terrain."
    liens: [wp-gouvernement, gouvernement-fr, od-annuaire-administration]
    verifie_le: 2026-09-06
    confiance: a_confirmer

  # --- Judiciaire : qui tranche --------------------------------------------
  # La France a deux ordres de juridiction séparés. Un litige avec une
  # administration ne va pas devant le même juge qu'un litige entre voisins,
  # et c'est la distinction la plus utile à connaître avant d'agir.
  - id: conseil-etat
    nom: "Le Conseil d'État"
    nom_court: "Conseil d'État"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire, executif]
    resume: "Deux fonctions à la fois : conseil juridique obligatoire du Gouvernement sur les projets de loi et d'ordonnance, et juge suprême de l'ordre administratif."
    liens: [wp-conseil-etat, conseil-etat-fr, code-justice-administrative, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: cour-administrative-appel
    nom: "La cour administrative d'appel"
    nom_court: "Cour admin. d'appel"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    resume: "Réexamine les jugements des tribunaux administratifs, dont ceux rendus sur les autorisations d'urbanisme, avant un éventuel pourvoi au Conseil d'État."
    liens: [wp-cour-administrative-appel, code-justice-administrative, conseil-etat-fr]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: tribunal-judiciaire
    nom: "Le tribunal judiciaire"
    nom_court: "Tribunal judiciaire"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    resume: "Juge les litiges entre personnes privées et les infractions pénales : l'autre ordre de juridiction, distinct de celui qui juge l'administration."
    liens: [wp-tribunal-judiciaire, code-organisation-judiciaire, justice-fr, wp-ordres-juridiction]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: cour-comptes
    nom: "La Cour des comptes"
    nom_court: "Cour des comptes"
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    resume: "Juge les comptes publics et contrôle l'emploi des fonds, en assistant le Parlement comme le Gouvernement ; les chambres régionales font ce travail pour les collectivités."
    liens: [wp-cour-comptes, ccomptes, code-juridictions-financieres, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: conseil-constitutionnel
    nom: "Le Conseil constitutionnel"
    nom_court: "Conseil constit."
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    resume: "Contrôle la conformité des lois à la Constitution, avant promulgation ou sur question prioritaire de constitutionnalité ; il n'appartient à aucun des deux ordres de juridiction."
    liens: [wp-conseil-constitutionnel, conseil-constitutionnel-fr, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  # --- Autorités indépendantes : ni exécutif, ni juge -----------------------
  # Placées par la loi hors de la hiérarchie des trois pouvoirs. Les ranger
