# Les nœuds du réseau : qui agit.
# Une phrase par acteur, pas davantage — le détail est sur les pages liées.
acteurs:
  # --- Vous -------------------------------------------------------------
  - id: citoyen
    nom: "Vous"
    nom_court: "Vous"
    type: personne
    echelon: citoyen
    resume: "Habitant, contribuable, électeur, usager, riverain : selon le rouage, vous n'avez pas les mêmes prises."
    liens: [vp-competences, od-datagouv]
    verifie_le: 2026-09-05
    confiance: etabli

  # --- Commune ----------------------------------------------------------
  - id: commune
    nom: "La commune"
    nom_court: "Commune"
    type: collectivite
    echelon: commune
    resume: "L'échelon de base, environ 35 000 en France, aux compétences très inégales selon ce qui a été transféré à l'intercommunalité."
    liens: [wp-commune, cgct, cl-gouv, od-ofgl]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: conseil-municipal
    nom: "Le conseil municipal"
    nom_court: "Conseil municipal"
    type: assemblee
    echelon: commune
    resume: "Vote le budget, les délibérations et le PLU. Ses séances sont publiques et ses délibérations communicables."
    liens: [wp-conseil-municipal, cgct, od-rne]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: maire
    nom: "Le maire"
    nom_court: "Maire"
    type: mandat_electif
    echelon: commune
    resume: "Exécutif de la commune et, pour certaines missions, agent de l'État : deux casquettes qui changent qui est responsable."
    liens: [wp-maire, cgct, od-rne]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: service-instructeur
    nom: "Le service urbanisme"
    nom_court: "Service urbanisme"
    type: service_administratif
    echelon: commune
    resume: "Instruit les demandes d'autorisation. Municipal, mutualisé à l'intercommunalité, ou assuré par l'État selon la taille de la commune."
    liens: [cu-r423-19, od-banatic]
    verifie_le: 2026-09-05
    confiance: variable_selon_territoire

  - id: police-municipale
    nom: "La police municipale"
    nom_court: "Police municipale"
    type: service_administratif
    echelon: commune
    resume: "Placée sous l'autorité du maire, aux pouvoirs distincts de ceux de la police nationale ou de la gendarmerie."
    liens: [code-securite-interieure, cgct]
    verifie_le: 2026-09-05
    confiance: a_confirmer

  # --- Intercommunalité -------------------------------------------------
  - id: epci
    nom: "L'intercommunalité"
    nom_court: "Intercommunalité"
    type: collectivite
    echelon: epci
    resume: "Communauté de communes, d'agglomération, urbaine ou métropole : exerce les compétences que les communes lui ont transférées."
    liens: [wp-epci, wp-intercommunalite, od-banatic, cgct]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: conseil-communautaire
    nom: "Le conseil communautaire"
    nom_court: "Conseil communautaire"
    type: assemblee
    echelon: epci
    resume: "Composé d'élus municipaux, il décide sur les compétences transférées — souvent celles qui pèsent le plus sur la facture."
    liens: [wp-intercommunalite, cgct, od-rne]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: syndicat-eau
    nom: "Le syndicat des eaux"
    nom_court: "Syndicat des eaux"
    type: collectivite
    echelon: epci
    resume: "Structure intercommunale spécialisée qui capte, traite et distribue l'eau, parfois via un délégataire privé."
    liens: [od-sispea, eaufrance, cgct]
    verifie_le: 2026-09-05
    confiance: variable_selon_territoire

  # --- Département ------------------------------------------------------
  - id: departement
    nom: "Le département"
    nom_court: "Département"
    type: collectivite
    echelon: departement
    resume: "Chef de file de l'action sociale : RSA, personnes âgées, protection de l'enfance. Gère aussi les collèges et les routes départementales."
    liens: [wp-departement, cgct, vp-competences, od-ofgl]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: conseil-departemental
    nom: "Le conseil départemental"
    nom_court: "Conseil dép."
    type: assemblee
    echelon: departement
    resume: "Assemblée élue par canton, qui vote un budget dont l'action sociale représente la plus grosse part."
    liens: [wp-conseil-departemental, od-rne, od-ofgl]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: sdis
    nom: "Les pompiers (SDIS)"
    nom_court: "Pompiers"
    type: service_administratif
    echelon: departement
    resume: "Établissement public financé par le département et les communes, mais dirigé opérationnellement par le préfet."
    liens: [wp-sdis, code-securite-interieure]
    verifie_le: 2026-09-05
    confiance: a_confirmer

  # --- Région -----------------------------------------------------------
  - id: region
    nom: "La région"
    nom_court: "Région"
    type: collectivite
    echelon: region
    resume: "Lycées, formation professionnelle, transports régionaux, développement économique et aménagement du territoire."
