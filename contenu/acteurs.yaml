    nom_court: "Défenseur des droits"
    type: autorite_independante
    echelon: etat
    pouvoirs: [independant]
    resume: "Autorité inscrite dans la Constitution, que toute personne peut saisir gratuitement en cas de litige avec un service public ou de discrimination."
    liens: [wp-defenseur-droits, defenseur-droits, constitution]
    verifie_le: 2026-09-06
