    verifie_le: 2026-09-05
    confiance: etabli

  - id: conseil-regional
    nom: "Le conseil régional"
    nom_court: "Conseil régional"
    type: assemblee
    echelon: region
    resume: "Assemblée élue au scrutin de liste régional, qui adopte notamment le schéma d'aménagement du territoire."
    liens: [wp-conseil-regional, od-rne]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: ars
    nom: "L'agence régionale de santé"
    nom_court: "Agence de santé (ARS)"
