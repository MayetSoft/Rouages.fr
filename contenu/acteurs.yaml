    verifie_le: 2026-09-06
    confiance: etabli

  - id: gouvernement
    nom: "Le Gouvernement"
    nom_court: "Gouvernement"
    type: organe_collegial
    echelon: etat
    pouvoirs: [executif]
    resume: "Le Premier ministre et les ministres : ils déterminent et conduisent la politique de la nation, et disposent de l'administration pour l'appliquer."
