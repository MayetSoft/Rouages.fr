    echelon: region
    resume: "Pilote l'offre de soins dans la région : autorisations d'activité, hôpitaux, prévention."
    liens: [wp-ars, ars-gouv, od-finess]
    verifie_le: 2026-09-05
    confiance: etabli

  # --- État -------------------------------------------------------------
  - id: etat
