    liens: [cgct, vp-competences, od-ofgl, wp-separation-pouvoirs, vp-separation-pouvoirs]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: prefet
    nom: "Le préfet"
    nom_court: "Préfet"
    type: mandat_electif
    echelon: etat
    pouvoirs: [executif]
    resume: "Représentant de l'État dans le département : ordre public, gestion de crise, et contrôle de légalité des actes des collectivités."
    liens: [wp-prefet, cgct, prefectures]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: rectorat
    nom: "Le rectorat et la DSDEN"
    nom_court: "Rectorat"
    type: service_deconcentre
    echelon: etat
    pouvoirs: [executif]
