    verifie_le: 2026-09-05
    confiance: etabli

  - id: abf
    nom: "L'architecte des Bâtiments de France"
    nom_court: "Bâtiments de France"
    type: service_deconcentre
    echelon: etat
    pouvoirs: [executif]
    resume: "Rend un avis, parfois conforme, sur les projets situés en périmètre de protection du patrimoine."
    liens: [wp-abf, code-patrimoine]
    verifie_le: 2026-09-05
    confiance: a_confirmer

  - id: caf
    nom: "La CAF"
    nom_court: "CAF"
    type: service_administratif
    echelon: etat
    pouvoirs: [executif]
    resume: "Verse les prestations familiales et sociales, dont le RSA financé par le département."
    liens: [wp-caf, caf-fr, code-action-sociale]
    verifie_le: 2026-09-05
    confiance: a_confirmer

  - id: agence-eau
    nom: "L'agence de l'eau"
    nom_court: "Agence de l'eau"
    type: service_administratif
    echelon: etat
    pouvoirs: [executif]
    resume: "Établissement de bassin qui perçoit des redevances sur l'eau et subventionne les travaux des collectivités."
    liens: [wp-agence-eau, code-environnement, eaufrance]
    verifie_le: 2026-09-05
    confiance: a_confirmer

  - id: tribunal-administratif
    nom: "Le tribunal administratif"
    nom_court: "Tribunal admin."
    type: juridiction
    echelon: etat
    pouvoirs: [judiciaire]
    resume: "Juge les litiges entre les particuliers et l'administration, dont les recours contre les autorisations d'urbanisme."
    liens: [wp-tribunal-administratif, sp-recours-urbanisme]
    verifie_le: 2026-09-05
    confiance: etabli

  # --- Législatif : qui vote la loi ---------------------------------------
  - id: assemblee-nationale
    nom: "L'Assemblée nationale"
    nom_court: "Assemblée nationale"
    type: assemblee
    echelon: etat
    pouvoirs: [legislatif]
    resume: "577 députés élus au suffrage universel direct : ils votent la loi et le budget de l'État, et peuvent renverser le Gouvernement."
    liens: [wp-assemblee-nationale, an-fr, vp-parlement, od-nosdeputes]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: senat
    nom: "Le Sénat"
    nom_court: "Sénat"
    type: assemblee
    echelon: etat
    pouvoirs: [legislatif]
    resume: "348 sénateurs élus par des grands électeurs très majoritairement issus des conseils municipaux ; la Constitution lui confie la représentation des collectivités territoriales."
    liens: [wp-senat, senat-fr, constitution, od-senat]
    verifie_le: 2026-09-06
    confiance: etabli

  - id: depute
    nom: "Le député"
    nom_court: "Député"
    type: mandat_electif
    echelon: etat
    pouvoirs: [legislatif]
