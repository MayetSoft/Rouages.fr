    liens: [wp-senateur, senat-fr, constitution]
    verifie_le: 2026-09-06
    confiance: etabli

  # --- Exécutif : qui décide et qui exécute --------------------------------
  - id: president-republique
    nom: "Le président de la République"
    nom_court: "Président de la Rép."
