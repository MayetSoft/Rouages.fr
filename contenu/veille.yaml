# Veille sur les sources de données.
#
# Ce projet se périme par ses sources, pas par son code. En une seule journée de
# travail, trois ruptures ont été rencontrées : l'interface Hub'Eau figée à 2018,
# BANATIC qui a refait son site et perdu son ancienne adresse de téléchargement,
# et l'export SISPEA dont l'URL change de forme selon le millésime. Aucune n'a
# produit d'alerte : elles ont été découvertes à la main, par hasard.
#
# Chaque source déclare donc ici le signal le moins coûteux qui soit réellement
# actionnable — pas un ping qui répond « 200 » pendant que la donnée dort depuis
# huit ans.
surveillances:
  - id: banatic-referentiel
    nom: "BANATIC — référentiel des compétences"
    alimente: "les compétences transférées à l'intercommunalité"
    type: banatic-competences
    url: "https://www.banatic.interieur.gouv.fr/consultation/api/referentiel/competence/all"
    lien: od-banatic

  - id: banatic-export
    nom: "BANATIC — export national des groupements"
    alimente: "le rattachement de chaque commune à ses groupements"
    type: disponibilite
    url: "https://www.banatic.interieur.gouv.fr/consultation/api/export/pregenere/telecharger/France"
    lien: od-banatic

  - id: ofgl-communes
    nom: "OFGL — comptes consolidés des communes"
    alimente: "les repères financiers"
    type: ofgl-millesime
    url: "https://data.ofgl.fr/api/explore/v2.1/catalog/datasets/ofgl-base-communes-consolidee"
    lien: od-ofgl

  # Le même fournisseur, une autre base : le versement mobilité et la taxe
  # d'enlèvement des ordures ménagères sont perçus par les groupements, pas par
  # les communes. Les surveiller dans la base communale les y trouverait — il y
  # traîne quelques centaines de lignes résiduelles — et masquerait leur
  # disparition là où le site les lit.
  - id: ofgl-groupements
    nom: "OFGL — comptes des groupements à fiscalité propre"
    alimente: "les flux perçus par l'intercommunalité"
    type: ofgl-millesime
    echelon: groupement
    url: "https://data.ofgl.fr/api/explore/v2.1/catalog/datasets/ofgl-base-gfp"
    lien: od-ofgl-flux

  - id: sispea-eau-potable
    nom: "SISPEA — services publics d'eau potable"
    alimente: "le prix de l'eau"
    type: sispea-millesime
    url: "https://data.ofb.fr/catalogue/srv/api/records/7d6a3010-cf19-42c3-8a38-9823074185ce"
    lien: od-sispea

  - id: decoupage-etalab
    nom: "Découpage administratif"
    alimente: "communes, départements, régions"
    type: paquet-npm
    url: "@etalab/decoupage-administratif"
    lien: od-datagouv

  - id: annuaire-education
    nom: "Annuaire de l'éducation"
    alimente: "les écoles, collèges et lycées de chaque commune"
    type: opendatasoft-total
    url: "https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-annuaire-education"
    attendu: 68939
    lien: od-annuaire-education

  # Le total sert de garde-fou, mais le vrai signal est ailleurs : une rentrée
  # de plus paraît chaque automne, et c'est elle qu'il faut aller chercher. Un
  # total qui grimpe d'environ 47 000 lignes le dira.
  # Le recensement grossit d'année en année — 12 630 marchés notifiés en 2021,
  # 254 191 en 2025. Le seuil est donc large : c'est une chute qui alerterait,
  # pas une hausse.
  # Une publication mensuelle : le total grossit d'environ 400 lignes par mois.
  # C'est une chute qui alerterait, pas une hausse.
  - id: dmto-recettes
    nom: "Droits de mutation — recettes par attributaire"
    alimente: "ce que rapporte une vente immobilière au département et aux communes"
    type: opendatasoft-total
    url: "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/dmto_attrib"
    # Relevé au 19 septembre 2026, pas estimé.
    attendu: 34935
    lien: od-dmto

  - id: decp-marches
    nom: "Commande publique — marchés valides"
    alimente: "ce que commandent la commune et ses syndicats"
    type: opendatasoft-total
    url: "https://data.economie.gouv.fr/api/explore/v2.1/catalog/datasets/decp-2022-marches-valides"
    # Relevé au 18 septembre 2026, pas estimé.
    attendu: 704853
    lien: od-decp-bercy

  - id: effectifs-ecoles
    nom: "Effectifs d'élèves par école"
    alimente: "le nombre de classes et d'élèves, école par école"
    type: opendatasoft-total
    url: "https://data.education.gouv.fr/api/explore/v2.1/catalog/datasets/fr-en-ecoles-effectifs-nb_classes"
    # Relevé au 13 septembre 2026, pas estimé.
    attendu: 859372
    lien: od-effectifs-ecoles

  - id: annuaire-administration
    nom: "Annuaire de l'administration"
    alimente: "les France services, les CCAS et les SDIS"
    type: opendatasoft-total
    url: "https://api-lannuaire.service-public.fr/api/explore/v2.1/catalog/datasets/api-lannuaire-administration"
    # Relevé, pas estimé : la première valeur écrite ici était de mémoire, et la
    # veille l'a rejetée au premier passage.
    attendu: 93784
    lien: od-annuaire-administration

  # Un nom périmé est pire qu'un nom absent : il envoie écrire à quelqu'un qui
  # n'est plus en fonction. Le seuil est serré — 5 % — parce qu'un répertoire
  # d'élus ne varie pas de beaucoup entre deux scrutins, et qu'une chute
  # signalerait une ressource tronquée plutôt qu'une actualité.
  # L'identifiant de ressource change à chaque millésime : le fichier 2026
  # n'est pas le fichier 2025. C'est la fragilité de cette source, et la
  # surveillance est là pour que sa disparition se voie au lieu de se deviner.
  - id: sru-inventaire
    nom: "Inventaire SRU — communes soumises à l'article 55"
    alimente: "l'obligation de logements sociaux de chaque commune"
    type: datagouv-tabulaire
    url: "https://tabular-api.data.gouv.fr/api/resources/2773f8ca-e06b-4a67-9844-ac165d52f47c/data/"
    # Relevé au 18 septembre 2026, pas estimé.
    attendu: 2206
    lien: od-sru

  - id: rne-maires
    nom: "Répertoire national des élus — maires"
    alimente: "le nom du maire de chaque commune"
    type: datagouv-tabulaire
    url: "https://tabular-api.data.gouv.fr/api/resources/2876a346-d50c-4911-934e-19ee07b0e503/data/"
    # Relevé au 13 septembre 2026, pas estimé.
    attendu: 34826
    lien: od-rne

  - id: finess-referentiel
    nom: "FINESS — établissements de santé"
    alimente: "les hôpitaux et les services d'urgences"
    # L'ingestion épingle une URL datée : sans surveillance, une nouvelle
    # publication ne changerait rien tant que personne ne la remarque.
    type: datagouv-ressource
    url: "referentiel-finess-t-finess"
    ressource: "t-finess.csv"
    lien: od-finess

# Ce qu'on cherche à voir apparaître. Les jeux déjà connus sont ignorés ; les
# autres sont proposés, à nous de juger s'ils méritent un nœud.
  - id: gaspar-risques
    nom: "GASPAR — risques majeurs, commune par commune"
    alimente: "les risques recensés, les catastrophes naturelles et les plans de prévention"
    # L'archive porte un nom fixe, mais les fichiers qu'elle contient sont
    # datés : c'est le jeu de données qu'on surveille, pas le fichier.
    type: disponibilite
    url: "http://files.georisques.fr/GASPAR/gaspar.zip"
    lien: od-gaspar

  - id: municipales-resultats
    nom: "Élections municipales — résultats par commune"
    alimente: "la participation, les bulletins blancs et nuls, et le nombre de listes"
    # L'adresse du fichier porte l'horodatage de sa publication : elle changera
    # au prochain scrutin, et c'est le jeu de données qui doit se voir bouger.
    type: datagouv-ressource
    url: "elections-municipales-2026-resultats-du-premier-tour"
    ressource: "resultats-communes"
    lien: od-municipales-2026

  - id: deliberations-megalis
    nom: "Délibérations — agrégateur Mégalis Bretagne"
    alimente: "les délibérations des collectivités qui les versent en données ouvertes"
    # Le plus gros agrégateur à ce jour, et le seul que la découverte par
    # schéma ne voit pas : il publie au format sans le déclarer sur ses
    # ressources. S'il s'arrête, la couverture fond de 90 %.
    type: datagouv-ressource
    url: "deliberations-des-organismes-adherents-de-megalis-bretagne"
    ressource: "deliberation-"
    lien: od-deliberations-megalis

  - id: subventions-schema
    nom: "Subventions aux associations — jeux conformes au schéma"
    alimente: "ce que les collectivités versent aux associations, là où elles le publient"
    # Aucun agrégateur : la couverture repose entièrement sur la découverte par
    # attribut de schéma. Si le catalogue cesse d'exposer cet attribut, tout
    # disparaît d'un coup et sans bruit.
    type: datagouv-ressource
    url: "donnees-essentielles-des-conventions-de-subvention-8"
    ressource: "subvention"
    lien: scdl-subventions

  - id: rne-conseillers
    nom: "Répertoire national des élus — conseillers municipaux et communautaires"
    alimente: "la composition des conseils : effectif, part de femmes, âge médian, groupes socioprofessionnels"
    # L'adresse des fichiers porte l'horodatage de leur publication, comme
    # Mégalis : c'est le jeu qu'on surveille, jamais le fichier, et le
    # collecteur résout ses ressources au moment de l'ingestion.
    type: datagouv-ressource
    url: "repertoire-national-des-elus-1"
    ressource: "conseillers-municipaux"
    lien: od-rne

  - id: insee-populations
    nom: "INSEE — séries historiques de population communale"
    alimente: "la population de chaque commune, recensement après recensement"
    # L'adresse porte le millésime du fichier : « 1876-2023 ». Sa disparition
    # est donc le signal qu'on cherche — un 404 veut dire qu'un millésime plus
    # récent existe, et qu'il faut changer l'adresse dans le collecteur.
    type: disponibilite
    url: "https://www.insee.fr/fr/statistiques/fichier/3698339/base-pop-historiques-1876-2023.xlsx"
    lien: od-insee-populations

  - id: rna-waldec
    nom: "Répertoire national des associations — fichier Waldec"
    alimente: "les créations d'associations, commune par commune"
    # Le fichier est réécrit au même nom à chaque millésime mensuel : un « 200 »
    # ne prouverait rien. C'est sa date de dernière modification qu'on regarde,
    # par une requête d'en-tête — on ne rapatrie pas 1,2 Go pour lire une date.
    type: fichier-date
    url: "https://data-pipeline-open.s3.sbg.io.cloud.ovh.net/rna/waldec.csv"
    lien: od-rna

decouverte:
  mots_cles:
    - "intercommunalité compétences"
    - "prix de l'eau assainissement"
    - "finances locales communes"
    - "annuaire éducation établissements"
    - "établissements de santé FINESS"
    - "France Services"
    - "casernes services d'incendie et de secours"
    # Ingérées depuis les jeux conformes au schéma SCDL, sans agrégat national :
    # on guette celui-ci, qui ferait passer la couverture de quelques dizaines
    # de collectivités à toutes celles qui publient.
    - "subventions associations collectivités"
    # Ingérées depuis les jeux conformes au schéma SCDL, mais sans
    # consolidation nationale : on guette celle-ci, qui ferait passer la
    # couverture de quelques milliers de collectivités à toutes.
    - "délibérations conseils municipaux"
    - "plan local d'urbanisme"
  # Publiées après cette date seulement : inutile de reproposer l'existant.
  depuis: 2026-01-01
