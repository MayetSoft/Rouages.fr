# Qui édite ce site.
#
# Un site accessible au public doit dire qui le publie et qui l'héberge
# (article 6 de la loi pour la confiance dans l'économie numérique). Ces
# informations ne se devinent pas depuis le dépôt : elles sont déclarées ici,
# et `npm run valider` refuse de publier tant qu'elles portent encore leur
# valeur d'attente. C'est la même règle que pour le reste du contenu — ce qui
# doit être vrai est vérifié par le build, pas par la mémoire de quelqu'un.
#
# Le nom qui figure ici est le seul du site, et il est là parce que la loi
# l'exige : la règle « le contenu ne nomme aucune personne physique » vaut
# pour le graphe, qui décrit des fonctions. Les mentions légales, elles,
# désignent quelqu'un — c'est leur objet. La validation le sait : le contrôle
# des noms porte sur les acteurs, compétences, documents, flux, sources,
# sigles, repères et processus, pas sur ce fichier.
editeur:
