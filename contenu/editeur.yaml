  # une association ou une société déclare sa raison sociale et son siège.
  nom: "François Fournier"
  # Un courriel, un formulaire ou une adresse : ce qui permet de vous joindre.
  contact: "contact@rouages.fr"
  # La personne responsable de ce qui est publié. Souvent la même que l'éditeur.
