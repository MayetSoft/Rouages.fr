  - id: cu-r423-23
    type: droit
    titre: "Code de l'urbanisme, art. R423-23 — Délais d'instruction"
    url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074075/
    consulte_le: 2026-09-05
  - id: cu-l424-2
    type: droit
    titre: "Code de l'urbanisme, art. L424-2 — Décision tacite"
    url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074075/
    consulte_le: 2026-09-05
  - id: cu-abf
    type: droit
    titre: "Code du patrimoine — Avis de l'architecte des Bâtiments de France"
    url: https://www.legifrance.gouv.fr/codes/texte_lc/LEGITEXT000006074236/
    consulte_le: 2026-09-05
  - id: cu-affichage
    type: droit
    titre: "Code de l'urbanisme, art. A424-15 et s. — Affichage sur le terrain"
    url: https://www.legifrance.gouv.fr/codes/section_lc/LEGITEXT000006074075/
    consulte_le: 2026-09-05
  - id: cu-r600-2
    type: droit
    titre: "Code de l'urbanisme, art. R600-2 — Délai de recours des tiers"
