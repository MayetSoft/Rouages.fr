# EXEMPLE DE STRUCTURE — pas encore un contenu publiable.
# Les valeurs juridiques (délais, articles) sont plausibles mais DOIVENT être
# vérifiées sur Légifrance avant toute publication : elles servent ici à
# éprouver le modèle de données, pas à informer un usager.
# Voir docs/03-modele-de-donnees.md

acteurs:
  - id: petitionnaire
    nom: "Le pétitionnaire"
    type: personne
    resume: "Celui qui demande l'autorisation : particulier, entreprise, collectivité."
    sources: [cu-livre4]
    verifie_le: 2026-09-05
    confiance: etabli

  - id: maire
    nom: "Le maire"
    type: mandat_electif
    echelon: commune
    resume: >
      Autorité qui délivre ou refuse le permis, au nom de la commune lorsqu'elle
      dispose d'un document d'urbanisme, au nom de l'État sinon.
    sources: [cu-l422-1]
    wikipedia: https://fr.wikipedia.org/wiki/Maire_(France)
    verifie_le: 2026-09-05
    confiance: etabli

  - id: service-instructeur
    nom: "Le service instructeur"
    type: service_administratif
    resume: >
      Instruit techniquement le dossier. Selon la taille de la commune : service
      urbanisme municipal, service mutualisé de l'intercommunalité, ou DDT.
    sources: [banatic]
    verifie_le: 2026-09-05
    confiance: variable_selon_territoire

  - id: abf
    nom: "L'architecte des Bâtiments de France"
    type: service_deconcentre
    resume: >
      Consulté, avec avis conforme, lorsque le projet se situe dans un périmètre
      de protection du patrimoine. Son avis lie alors le maire.
    sources: [cu-abf]
    wikipedia: https://fr.wikipedia.org/wiki/Architecte_des_B%C3%A2timents_de_France
    verifie_le: 2026-09-05
    confiance: a_confirmer

competences:
  - id: delivrance-autorisation-urbanisme
    nom: "Délivrer les autorisations d'urbanisme"
    acteur: maire
    resume: >
      Compétence exercée au nom de la commune si elle est dotée d'un PLU ou d'une
      carte communale ; au nom de l'État dans le cas contraire.
    partagee_avec: [abf]
    sources: [cu-l422-1]
    verifie_le: 2026-09-05
    confiance: etabli

documents:
  - id: cerfa-pc
    nom: "Formulaire de demande de permis de construire"
    ou_le_trouver: https://www.service-public.fr/particuliers/vosdroits/R11637
    sources: [sp-pc]
  - id: plu
    nom: "Plan local d'urbanisme (PLU)"
    resume: "Le règlement qui dit ce qui est constructible, et comment."
    ou_le_trouver: "Mairie, ou Géoportail de l'urbanisme"
    sources: [gpu]
  - id: panneau-affichage
    nom: "Panneau d'affichage du permis sur le terrain"
    resume: "Déclenche le délai de recours des tiers. Élément central."
    sources: [cu-affichage]

processus:
  - id: permis-construire-plu
    nom: "Permis de construire en commune dotée d'un PLU"
    famille: quotidien
    resume: >
      Du dépôt de la demande à la fin du délai de recours : qui intervient,
      dans quel ordre, et où le voisinage peut se manifester.
    declencheur: "Dépôt d'une demande de permis par le pétitionnaire"
    sortie: "Arrêté de permis, de refus, ou décision tacite"

    etapes:
      - ordre: 1
        acteur: petitionnaire
        action: "Dépôt du dossier en mairie ou par téléprocédure"
        produit: [cerfa-pc]
        sources: [sp-pc]
      - ordre: 2
        acteur: service-instructeur
        action: "Vérification de la complétude ; point de départ du délai"
        delai: { valeur: 1, unite: mois, nature: maximum_legal }
        sources: [cu-r423-22]
      - ordre: 3
        acteur: service-instructeur
        action: "Instruction technique, consultation des services concernés"
        delai: { valeur: 2, unite: mois, nature: maximum_legal }
        note: "Délai porté à 3 mois pour les projets autres que maison individuelle."
        sources: [cu-r423-23]
        confiance: a_confirmer
      - ordre: 4
        acteur: abf
        action: "Avis conforme si le projet est en périmètre protégé"
        conditionnelle: true
        sources: [cu-abf]
      - ordre: 5
        acteur: maire
        action: "Signature de l'arrêté (accord, refus, ou accord avec prescriptions)"
        note: "L'absence de réponse dans le délai vaut en principe accord tacite."
        sources: [cu-l424-2]
        confiance: a_confirmer
      - ordre: 6
        acteur: petitionnaire
        action: "Affichage du permis sur le terrain, visible depuis la voie publique"
        produit: [panneau-affichage]
        sources: [cu-affichage]

    leviers:
      - id: consulter-plu
        quoi: "Lire le PLU avant tout : il détermine ce qui est autorisé."
        quand: "À tout moment, y compris avant l'achat d'un terrain"
        aupres_de: "Mairie, ou Géoportail de l'urbanisme"
        difficulte: faible
        sources: [gpu]

      - id: consulter-dossier
        quoi: "Demander à consulter le dossier de permis déposé"
        quand: "Dès le dépôt ; le registre des demandes est public"
        aupres_de: "Service urbanisme de la mairie"
        difficulte: faible
        recours_si_refus: "Saisir la CADA"
        sources: [cada]
        confiance: a_confirmer

      - id: recours-tiers
        quoi: "Contester le permis délivré (recours gracieux, puis contentieux)"
        quand: "2 mois à compter du premier jour d'affichage régulier sur le terrain"
        aupres_de: "Le maire (gracieux), puis le tribunal administratif"
        difficulte: moyenne
        piege: >
          Le délai court depuis l'affichage sur le terrain, pas depuis la date de
          l'arrêté. Photographier le panneau et sa date. Un affichage irrégulier
          ou absent peut prolonger le délai — c'est souvent le seul angle.
        sources: [cu-r600-2]
        confiance: a_confirmer

flux:
  - id: taxe-amenagement
    nature: argent
    de: petitionnaire
    vers: [commune, departement]
    resume: "Taxe d'aménagement due à raison de l'autorisation délivrée."
    sources: [taxe-amenagement]
    confiance: a_confirmer

